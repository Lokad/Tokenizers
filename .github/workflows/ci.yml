name: ci

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Restore locked dependencies
        run: dotnet restore Lokad.Tokenizers.slnx --locked-mode --tl:off -v minimal
      - name: Verify canonical protobuf generation
        run: ./eng/generate-protobuf.ps1 -Check
      - name: Build Release
        run: dotnet build Lokad.Tokenizers.slnx -c Release --no-restore --tl:off --nologo -v minimal
      - name: Test offline fixtures
        run: dotnet test Lokad.Tokenizers.slnx -c Release --no-build --no-restore --tl:off --nologo -v minimal --logger trx --results-directory artifacts/test-results
      - name: Pack Release
        run: dotnet pack src/Lokad.Tokenizers.csproj -c Release --no-build --no-restore --tl:off --nologo -v minimal -o artifacts/dev/nuget
      - name: Install Python oracle
        run: python -m pip install -r test/python/requirements.txt
      - name: Qualify pinned Gemma tokenization
        run: ./eng/test-gemma.ps1 -Python python -Download -SkipBuild
      - name: Qualify XLM-R Unicode and legacy fixtures
        run: ./eng/test-xlm.ps1 -Python python -SkipBuild
      - name: Resolve latest .NET 11 SDK
        id: dotnet11
        run: |
          $metadata = Invoke-RestMethod 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/11.0/releases.json'
          "version=$($metadata.'latest-sdk')" >> $env:GITHUB_OUTPUT
      - name: Install .NET 11 for package compatibility
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: ${{ steps.dotnet11.outputs.version }}
      - name: Verify independent package consumer
        run: ./tools/PackageSmokeTest/verify-package.ps1 -OutputDirectory artifacts/dev/nuget -ConsumerFrameworks net10.0,net11.0 -SkipPack
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/
            artifacts/gemma/
            artifacts/xlm/
          if-no-files-found: ignore
      # Development packages validate this source; published artifacts stay separate.
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/dev/nuget/
          if-no-files-found: error
